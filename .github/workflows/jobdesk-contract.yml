name: JobDesk Consumer Contract

# Candidate-wheel contract check against the CURRENT official JobDesk
# repository (moxuezhuchen/jobdesk-v2).  The installed candidate wheel is
# checked against the current consumer's boundary in a neutral working
# directory (no source shadowing) and then exercised by the current
# consumer's V4 cross-repo suites at an explicit pinned SHA.  The pin is kept
# identical to tests/v4/jobdesk_integration.py::EXPECTED_JOBDESK_SHA and to
# the paired workflow.  The retired legacy consumer repository is not
# referenced.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  #: Pinned current-consumer compatibility target (JobDesk-v2).
  JOBDESK_COMPAT_SHA: "7ce13c5f5a76b877c03b7fcfa89f4a84e6976258"

jobs:
  candidate-wheel-against-current-consumer:
    name: Candidate wheel with JobDesk-v2
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate ConfFlow
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: confflow

      - name: Check out the current JobDesk consumer at the pinned revision
        uses: actions/checkout@v7
        with:
          repository: moxuezhuchen/jobdesk-v2
          ref: ${{ env.JOBDESK_COMPAT_SHA }}
          path: jobdesk-v2
          # The current consumer repository is private; the token is a
          # repository secret.  Fork pull requests do not receive it and
          # the job fails closed instead of silently skipping the pair.
          token: ${{ secrets.JOBDESK_V2_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the candidate wheel
        working-directory: confflow
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/confflow-dist"

      - name: Install the exact producer candidate and the consumer runtime
        run: |
          set -euo pipefail
          wheel="$(find "$RUNNER_TEMP/confflow-dist" -maxdepth 1 -name 'confflow-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "$wheel"
          python -m pip install PyYAML rfc8785 pytest
          python -c 'import confflow; print(confflow.__version__)'

      - name: Verify the paired revision is the audited target
        working-directory: confflow
        env:
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          wheel="$(find "$RUNNER_TEMP/confflow-dist" -maxdepth 1 -name 'confflow-*.whl' -print -quit)"
          echo "candidate_wheel=$wheel"
          echo "candidate_wheel_sha256=$(sha256sum "$wheel" | awk '{print $1}')"
          pinned="$(python -c 'from tests.v4.jobdesk_integration import EXPECTED_JOBDESK_SHA; print(EXPECTED_JOBDESK_SHA)')"
          actual="$(git -C ../jobdesk-v2 rev-parse HEAD)"
          echo "jobdesk_v2_commit=$actual"
          echo "pinned_jobdesk_sha=$pinned"
          echo "workflow_pinned_sha=$JOBDESK_COMPAT_SHA"
          test "$pinned" = "$JOBDESK_COMPAT_SHA"
          test "$actual" = "$pinned"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"

      - name: Verify the installed wheel against the current consumer boundary
        working-directory: ${{ runner.temp }}
        env:
          JOBDESK_V2_SRC: ${{ github.workspace }}/jobdesk-v2/src
        run: |
          # Neutral cwd: `import confflow` resolves to the installed wheel, not
          # the checkout.  This exercises the packaged producer boundary with
          # the current consumer's own parser (production APIs only).
          python - <<'PY'
          import json
          import os
          import sys

          sys.path.insert(0, os.environ["JOBDESK_V2_SRC"])
          import confflow
          from confflow.producer.contract import generate_contract_bytes
          from jobdesk_v2.application.editor.contract.v4 import parse_v4_contract_bytes

          raw = generate_contract_bytes(producer_version=confflow.__version__)
          contract = parse_v4_contract_bytes(raw)
          print(json.dumps({
              "confflow": confflow.__version__,
              "contract_schema": contract.content_schema,
              "workflow_schema_id": contract.workflow_schema_id,
              "producer": contract.producer_version,
          }))
          PY

      - name: Run the consumer contract suite against the candidate
        working-directory: confflow
        env:
          JOBDESK_V2_SRC: ${{ github.workspace }}/jobdesk-v2/src
        run: |
          python -m pytest -q \
            tests/v4/test_v46_application.py \
            tests/v4/test_v46_cross_repo.py \
            tests/v4/test_v46_cross_repo_e2e.py \
            tests/v4/test_v46_debt.py \
            tests/v4/test_v46_producer_closure.py \
            tests/v4/test_v46_tspes_e2e.py
