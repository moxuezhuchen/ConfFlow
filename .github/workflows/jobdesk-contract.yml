name: JobDesk Consumer Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate-wheel-against-jobdesk-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate ConfFlow
        uses: actions/checkout@v6
        with:
          path: confflow

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the candidate wheel
        working-directory: confflow
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/confflow-dist"

      - name: Check out JobDesk main
        uses: actions/checkout@v4
        with:
          repository: moxuezhuchen/jobdesk
          ref: main
          path: jobdesk

      - name: Install the exact producer candidate and consumer
        run: |
          set -euo pipefail
          python -m pip install -e "jobdesk[dev]"
          wheel="$(find "$RUNNER_TEMP/confflow-dist" -maxdepth 1 -name 'confflow-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "$wheel"
          python -c 'import confflow; print(confflow.__version__)'

      - name: Run consumer contract suite
        working-directory: jobdesk
        run: |
          python -m pytest -q \
            tests/test_confflow_preflight.py \
            tests/test_confflow_results.py \
            tests/test_confflow_control_backend.py \
            tests/test_confflow_launcher_integration.py
