name: Paired JobDesk Compatibility

# Paired producer/consumer CI against the CURRENT official JobDesk repository
# (moxuezhuchen/jobdesk-v2).  The compatibility target is an explicit pinned
# SHA, kept identical to tests/v4/jobdesk_integration.py::EXPECTED_JOBDESK_SHA
# by the "Verify the paired revision is the audited target" step; the
# cross-repo tests themselves also fail closed on a revision mismatch.
#
# The retired legacy consumer repository is deliberately NOT referenced:
# the current consumer is jobdesk-v2, and its V4 cross-repo suites are the
# product harness.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confflow_ref:
        description: ConfFlow candidate branch or commit to test
        required: true
        type: string
      jobdesk_ref:
        description: >-
          JobDesk-v2 revision to test. Leave empty for the pinned target; a
          candidate must be paired with a ConfFlow branch that pins the same
          revision, or the fail-closed revision check stops the job.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  #: Pinned current-consumer compatibility target (JobDesk-v2).  Updated only
  #: together with tests/v4/jobdesk_integration.py::EXPECTED_JOBDESK_SHA.
  JOBDESK_COMPAT_SHA: "7ce13c5f5a76b877c03b7fcfa89f4a84e6976258"

jobs:
  candidate-pair:
    name: ConfFlow candidate with JobDesk-v2 candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out ConfFlow candidate
        uses: actions/checkout@v7
        with:
          repository: moxuezhuchen/ConfFlow
          ref: ${{ inputs.confflow_ref || github.event.pull_request.head.sha || github.sha }}
          path: confflow
          fetch-depth: 1

      - name: Resolve the paired JobDesk-v2 revision
        id: pair
        run: |
          set -euo pipefail
          ref="${{ inputs.jobdesk_ref }}"
          if [ -z "$ref" ]; then
            ref="$JOBDESK_COMPAT_SHA"
          fi
          echo "jobdesk_ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out JobDesk-v2 candidate
        uses: actions/checkout@v7
        with:
          repository: moxuezhuchen/jobdesk-v2
          ref: ${{ steps.pair.outputs.jobdesk_ref }}
          path: jobdesk-v2
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and install the ConfFlow candidate
        working-directory: confflow
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/confflow-dist"
          wheel="$(find "$RUNNER_TEMP/confflow-dist" -maxdepth 1 -name 'confflow-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "$wheel"
          # The cross-repo suites import the JobDesk-v2 consumer application
          # layer only; its runtime dependencies are PyYAML and rfc8785
          # (PySide6 is never imported by these suites).
          python -m pip install PyYAML rfc8785 pytest

      - name: Verify the paired revision is the audited target
        working-directory: confflow
        run: |
          set -euo pipefail
          pinned="$(python -c 'from tests.v4.jobdesk_integration import EXPECTED_JOBDESK_SHA; print(EXPECTED_JOBDESK_SHA)')"
          actual="$(git -C ../jobdesk-v2 rev-parse HEAD)"
          echo "confflow_commit=$(git rev-parse HEAD)"
          echo "jobdesk_v2_commit=$actual"
          echo "pinned_jobdesk_sha=$pinned"
          echo "workflow_pinned_sha=$JOBDESK_COMPAT_SHA"
          test "$pinned" = "$JOBDESK_COMPAT_SHA"
          test "$actual" = "$pinned"

      - name: Run the paired producer/consumer suite
        working-directory: confflow
        env:
          JOBDESK_V2_SRC: ${{ github.workspace }}/jobdesk-v2/src
        run: |
          python -m pytest -q \
            tests/v4/test_v46_application.py \
            tests/v4/test_v46_cross_repo.py \
            tests/v4/test_v46_cross_repo_e2e.py \
            tests/v4/test_v46_debt.py \
            tests/v4/test_v46_producer_closure.py \
            tests/v4/test_v46_tspes_e2e.py
