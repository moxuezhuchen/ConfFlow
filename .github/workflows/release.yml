name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated tag to release
        required: true
        default: v2.1.4
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    env:
      EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build cyclonedx-bom

      - name: Verify tagged clean checkout
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          EXPECTED_VERSION="${EXPECTED_TAG#v}"
          test -n "$PROJECT_VERSION"
          test "$EXPECTED_VERSION" = "$PROJECT_VERSION"
          test "$(git cat-file -t "$EXPECTED_TAG")" = "tag"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$EXPECTED_TAG^{commit}")"
          RELEASE_LOCK="release/confflow-${PROJECT_VERSION}-py312-linux-x86_64.lock"
          RELEASE_MANIFEST="release/confflow-${PROJECT_VERSION}-py312-linux-x86_64.SHA256SUMS"
          test -s "$RELEASE_LOCK"
          test -s "$RELEASE_MANIFEST"
          {
            echo "RELEASE_VERSION=$PROJECT_VERSION"
            echo "RELEASE_LOCK=$RELEASE_LOCK"
            echo "RELEASE_MANIFEST=$RELEASE_MANIFEST"
          } >> "$GITHUB_ENV"

      - name: Verify pip runtime wheelhouse against committed manifest
        run: |
          set -euo pipefail
          WHEELHOUSE="${RUNNER_TEMP}/confflow-${RELEASE_VERSION}-wheelhouse"
          rm -rf "$WHEELHOUSE"
          mkdir -p "$WHEELHOUSE"
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --dest "$WHEELHOUSE" \
            -r "$RELEASE_LOCK"
          cp -- "$RELEASE_MANIFEST" "$WHEELHOUSE/SHA256SUMS"
          python - "$RELEASE_LOCK" "$WHEELHOUSE" <<'PY'
          from __future__ import annotations

          import platform
          import sys
          import sysconfig
          from pathlib import Path

          from confflow.release_dependencies import validate_dependency_inputs

          lock = Path(sys.argv[1])
          wheelhouse = Path(sys.argv[2])
          evidence = validate_dependency_inputs(
              lock,
              wheelhouse,
              runtime_identity={
                  "python_version": platform.python_version(),
                  "python_implementation": platform.python_implementation(),
                  "platform": sysconfig.get_platform(),
                  "machine": platform.machine(),
              },
          )
          print("verified pip wheelhouse: " + ", ".join(evidence.wheel_filenames))
          PY

      - name: Clean dedicated dist and build final wheel and sdist once
        run: |
          set -euo pipefail
          BUILD_DIR="${RUNNER_TEMP}/confflow-release-dist"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          rm -rf dist
          # Build the sdist and wheel in separate source-checkout invocations.
          # `python -m build --wheel --sdist` may rebuild the wheel from the
          # sdist, where setup.py cannot read the tagged git commit and would
          # emit null wheel-internal provenance. Keep the output outside the
          # checkout so it cannot make the source tree appear dirty.
          python -m build --sdist --outdir "$BUILD_DIR"
          python -m build --wheel --outdir "$BUILD_DIR"
          mkdir -p dist
          cp -- "$BUILD_DIR"/* dist/

      - name: Verify final wheel metadata and build provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          dist = Path("dist")
          wheels = sorted(dist.glob(f"confflow-{version}-*.whl"))
          sdists = sorted(dist.glob(f"confflow-{version}.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"expected exactly one {version} wheel and sdist; got {wheels} / {sdists}"
              )
          wheel = wheels[0]
          expected_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          with zipfile.ZipFile(wheel) as archive:
              metadata = archive.read(f"confflow-{version}.dist-info/METADATA").decode()
              build_module = ast.parse(archive.read("confflow/__build__.py").decode())
          if f"Version: {version}" not in metadata:
              raise SystemExit(f"wheel metadata does not declare version {version}")
          values = {}
          for node in build_module.body:
              target = node.target if isinstance(node, ast.AnnAssign) else None
              if isinstance(target, ast.Name) and target.id in {"COMMIT", "DIRTY"}:
                  values[target.id] = ast.literal_eval(node.value)
          if values.get("COMMIT") != expected_commit or values.get("DIRTY") is not False:
              raise SystemExit(
                  f"wheel provenance mismatch: {values!r}, expected {expected_commit}/False"
              )
          print(f"verified {wheel.name}: commit={expected_commit} dirty=false")
          PY

      - name: Generate CycloneDX SBOM from the controlled runtime lock
        run: |
          set -euo pipefail
          cyclonedx-py requirements \
            "$RELEASE_LOCK" \
            --output-format JSON \
            --output-file dist/sbom.cdx.json
          test -s dist/sbom.cdx.json

      - name: Attest final wheel build provenance
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/confflow-*.whl
          show-summary: true

      - name: Export attestation bundle and release attestation record
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ATTESTATION_BUNDLE"
          cp -- "$ATTESTATION_BUNDLE" dist/attestation.bundle.json
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          version = os.environ["RELEASE_VERSION"]
          dist = Path("dist")
          wheel = next(dist.glob(f"confflow-{version}-*.whl"))
          bundle = dist / "attestation.bundle.json"
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          payload = {
              "schema": "confflow.release-attestation.v1",
              "subject_filename": wheel.name,
              "subject_digest": digest(wheel),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "tag": os.environ["EXPECTED_TAG"],
              "peeled_commit": commit,
              "bundle_filename": bundle.name,
              "bundle_sha256": digest(bundle),
          }
          (dist / "attestation.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Add controlled runtime inputs to release assets
        run: |
          set -euo pipefail
          cp -- "$RELEASE_LOCK" "dist/$(basename "$RELEASE_LOCK")"
          cp -- "$RELEASE_MANIFEST" "dist/$(basename "$RELEASE_MANIFEST")"

      - name: Write release provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          version = os.environ["RELEASE_VERSION"]
          dist = Path("dist")
          wheel = next(dist.glob(f"confflow-{version}-*.whl"))
          sdist = next(dist.glob(f"confflow-{version}.tar.gz"))
          sbom = dist / "sbom.cdx.json"
          attestation = dist / "attestation.json"
          attestation_bundle = dist / "attestation.bundle.json"
          lock = Path(os.environ["RELEASE_LOCK"])
          wheelhouse_manifest = Path(os.environ["RELEASE_MANIFEST"])
          lock_asset = dist / lock.name
          manifest_asset = dist / wheelhouse_manifest.name
          if not lock_asset.is_file() or lock_asset.read_bytes() != lock.read_bytes():
              raise SystemExit("release lock asset does not match the checked-in lock")
          if (
              not manifest_asset.is_file()
              or manifest_asset.read_bytes() != wheelhouse_manifest.read_bytes()
          ):
              raise SystemExit("release wheelhouse manifest asset does not match the checked-in manifest")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          payload = {
              "schema": "confflow.release-provenance.v1",
              "package": "confflow",
              "version": version,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "tag": os.environ["EXPECTED_TAG"],
              "commit": commit,
              "wheel_filename": wheel.name,
              "wheel_sha256": digest(wheel),
              "sdist_filename": sdist.name,
              "sdist_sha256": digest(sdist),
              "sbom_filename": sbom.name,
              "sbom_sha256": digest(sbom),
              "attestation_filename": attestation.name,
              "attestation_sha256": digest(attestation),
              "attestation_bundle_filename": attestation_bundle.name,
              "attestation_bundle_sha256": digest(attestation_bundle),
              "attestation_subject_digest": digest(wheel),
              "dependency_lock_filename": lock.name,
              "dependency_lock_sha256": digest(lock),
              "wheelhouse_manifest_filename": wheelhouse_manifest.name,
              "wheelhouse_manifest_sha256": digest(wheelhouse_manifest),
          }
          (dist / "provenance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Write release notes and SHA256SUMS
        run: |
          set -euo pipefail
          {
            echo "ConfFlow ${EXPECTED_TAG} release artifacts"
            echo
            echo "The wheel was built once from the peeled tag commit."
            echo "GitHub build provenance attestation subject: final wheel."
          } > dist/RELEASE_ARTIFACTS.md
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          dist = Path("dist")
          paths = sorted(path for path in dist.iterdir() if path.is_file())
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in paths
              if path.name != "SHA256SUMS"
          ]
          (dist / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload workflow artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: confflow-release-artifacts
          if-no-files-found: error
          path: dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$EXPECTED_TAG" \
            --verify-tag \
            --title "ConfFlow $EXPECTED_TAG" \
            --notes-file dist/RELEASE_ARTIFACTS.md \
            dist/*
