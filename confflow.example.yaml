# ============================================================================
# ConfFlow example workflow (V4) — 计算化学工作流示例
#
# 这是 **V4** 工作流文档：`schema: confflow.workflow.v4` 是当前唯一受支持的
# 工作流/配置格式。历史上随 wheel 发布的 V2 示例（`global`/`steps` +
# `iprog`/`itask`/`params`）已随 V1/V2 配置 wire 一起退役（Architecture Diet
# PR-9），V1/V2/V3 文档现在在入口处以 `unsupported_workflow_version` 失败关闭。
#
# Run it:
#   confflow v4 validate --workflow confflow.example.yaml --json
#   confflow v4 run --workflow confflow.example.yaml \
#     --inputs structures=mol.xyz --run-root ./run \
#     --executable orca=/opt/orca601/orca --json
#
# Document shape (see docs/architecture/WORKFLOW_V4.md)
# -----------------------------------------------------
# schema    当前唯一 schema id。
# inputs    具名运行输入。`grouping: each_entity` 表示每个导入实体各自成为一个
#           reaction-group lineage 的根（group_key/lineage_root_id 由实体 id
#           派生，绝不按列表位置或文件名配对）。
# global    运行级默认值：scientific_defaults(summary) / resources / scheduler。
#           它们是默认值，不是显式覆盖；步骤级声明会覆盖它们。
# steps     每个步骤恰好一个 executor：
#
#   executor: confgen           确定性的扭转角构象生成
#     confgen.native.chains     1-based、以 "-" 连接的原子链，必需
#     confgen.native.angle_step 每根键的角度步长（1..360）
#     confgen.native.*          旋转侧、键长缩放、碰撞阈值、max_conformers 等
#     confgen.seed              显式整数种子（单一权威；未声明则失败关闭）
#
#   executor: calculation       一次量子化学计算
#     calculation.program       "orca" / "g16"（真实注册表为准）
#     calculation.role          该步骤在 lineage 中的角色: opt / freq / sp /
#                               ts / irc / path_endpoints ...
#     calculation.native        程序原生块（keyword、irc/goat/neb 小节等），
#                               由 program adapter 原样渲染
#     calculation.checks        科学检查名（真实注册表为准）
#     calculation.recovery      声明的恢复 profile（默认 "none"）
#     calculation.overrides     仅允许有定义优先级语义的科学覆盖
#                               （当前: charge / multiplicity / freeze）
#
#   executor: transform         显式的结构集变换: refine / deduplicate / filter
#   executor: analysis          对上游结果做科学分析（reaction_profile 等）
#
# bindings  步骤的输入端口绑定。`source.step` 引用上游步骤，`source.run`
#           引用本次运行的具名输入。绑定按身份/group/lineage 解析，绝不按
#           文件名或列表序号配对。
#
# resources / scheduler / completion / execution
#           每个步骤可覆盖：资源请求（每 work item）、并行宽度（operational，
#           永不进入科学 digest）、完成策略、机器侧执行绑定
#           （executable / env / sandbox / allowed_executables / walltime）。
#
# 说明：V4 没有隐式的 auto_clean/去重尾巴。清洗与去重是**显式的** transform
# 步骤或 analysis 步骤 —— 任何隐藏的收尾处理都是被禁止的。
# ============================================================================

schema: confflow.workflow.v4

inputs:
  structures:
    kind: structure
    cardinality: many
    grouping: each_entity

global:
  scientific_defaults:
    charge: 0
    multiplicity: 1
  resources:
    cores_per_item: 8
    memory_per_item: 32GiB
  scheduler:
    max_parallel_items: 4

steps:
  - id: confgen
    label: "Step 01: conformer generation (torsion scan along chain 1-2-3-4)"
    executor: confgen
    bindings:
      structure:
        source: {run: structures}
    confgen:
      native:
        chains: ["1-2-3-4"]
        angle_step: 120
      seed: 20260928
    resources:
      cores_per_item: 1
      memory_per_item: 2GiB

  - id: opt
    label: "Step 02: geometry optimisation"
    executor: calculation
    bindings:
      structure:
        source: {step: confgen, port: structures}
    calculation:
      program: orca
      role: opt
      execution_adapter: standard
      result_profile: standard
      native:
        keyword: "B3LYP D3BJ def2-SVP Opt"
      checks: ["normal_termination", "geometry_required"]
      recovery: {profile: "none"}
      overrides:
        # 冻结原子（1-based）；V4 只在 overrides 白名单里接受定义过的覆盖。
        freeze: [1, 2]
    resources:
      cores_per_item: 8
      memory_per_item: 32GiB
    scheduler:
      max_parallel_items: 4

  - id: opt_freq
    label: "Step 03: frequency analysis"
    executor: calculation
    bindings:
      structure:
        source: {step: opt, port: structures}
    calculation:
      program: orca
      role: freq
      execution_adapter: standard
      result_profile: standard
      native:
        keyword: "B3LYP D3BJ def2-SVP Freq"
      checks: ["normal_termination", "frequencies_required"]
      recovery: {profile: "none"}
