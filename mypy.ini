[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_ignores = False
warn_redundant_casts = True
warn_unused_configs = True
show_error_codes = True
pretty = True
implicit_optional = True
# All strictness codes are now enabled (tightened progressively):
#   arg-type    – fixed (was 70 errors); enabled 2026-10-08 via
#                 annotation/cast-only changes, no behavioral deltas
#   assignment  – fixed (was 19 errors); re-enabled
#   misc        – fixed (was 19 errors); re-enabled
#   attr-defined – RDKit / numba dynamic attributes (now enabled)
#   no-any-return – enabled progressively
disable_error_code =

# 忽略缺失的第三方库存根
ignore_missing_imports = True
no_site_packages = True

# 对 confflow 包启用逐步严格检查
[mypy-confflow.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

# 测试文件宽松

